name: macOS (arm64)

# Tests and builds the macOS release (release/macos). Pushing a tag macos-<version>
# (e.g. macos-1.5.4-2) publishes a GitHub release with the disk image.
# The release contains no files of the retail game: the patches of pak007.pk4 are
# committed in release/macos/patches, the CI never needs the game.

on:
  push:
    branches:
      - main
    tags:
      - 'macos-*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  tests:
    name: Release tools tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run tests
        run: python3 -m unittest discover -s release/macos/tests -v

  build:
    name: Build Prey2006.app and the disk image
    needs: tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # tags for the version

      - name: Install build tools
        run: |
          for tool in cmake ninja pkg-config; do
            command -v $tool > /dev/null || brew install $tool
          done

      - name: Restore SDL2 and OpenAL Soft
        uses: actions/cache@v6
        with:
          path: build-release/macos/deps
          key: macos-deps-11.0-${{ hashFiles('neo/libs/SDL2/**', 'neo/libs/OpenalSoft/**', 'release/macos/build_release.sh') }}

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/macos-* ]]; then
            version="${GITHUB_REF_NAME#macos-}"
          else
            version="$(git describe --tags --always | sed 's/^v//')"
          fi
          echo "Version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: release/macos/build_release.sh "${{ steps.version.outputs.version }}"

      - name: Upload the disk image
        uses: actions/upload-artifact@v7
        with:
          name: prey2006-${{ steps.version.outputs.version }}-macos-arm64
          path: |
            build-release/macos/*.dmg
            build-release/macos/*.dmg.sha256
            build-release/macos/release-notes.md
          compression-level: 0
          if-no-files-found: error

  release:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/macos-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifact
          merge-multiple: true

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#macos-}"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Prey2006 $version for macOS" \
            --notes-file artifact/release-notes.md \
            artifact/*.dmg artifact/*.dmg.sha256
